name: Build and release Veyra
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veyra-linux-flatpak
          path: release-artifacts
      - name: Prepare source archive with Rust dependencies
        run: |
          set -euo pipefail
          rustup show active-toolchain
          source_dir="$RUNNER_TEMP/veyra-source"
          mkdir -p "$source_dir/.cargo"
          git archive HEAD | tar -x -C "$source_dir"
          cargo vendor --locked --versioned-dirs --manifest-path src-tauri/Cargo.toml "$source_dir/rust-vendor" > "$source_dir/.cargo/config.toml"
          python3 - "$source_dir" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); config=root/'.cargo/config.toml'
          config.write_text(config.read_text().replace(str(root/'rust-vendor'), 'rust-vendor'))
          PY
          source_epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -czf "release-artifacts/Veyra-${GITHUB_REF_NAME#v}-source.tar.gz" -C "$source_dir" .
          cd release-artifacts
          sha256sum ./*.flatpak ./*-source.tar.gz > SHA256SUMS
      - name: Publish only successful tagged builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --title "Veyra $RELEASE_TAG" --generate-notes)
          # Development metadata remains a prerelease even with a MAJOR.MINOR.PATCH tag.
          development=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('packaging/flatpak/io.github.LucasGruber.Veyra.metainfo.xml').find('releases/release').get('type') == 'development')")
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* || "$development" == True ]]; then prerelease=true; args+=(--prerelease); fi
          metadata="$RUNNER_TEMP/veyra-release.json"
          errors="$RUNNER_TEMP/veyra-release-errors.txt"
          if gh release view "$RELEASE_TAG" --json isDraft > "$metadata" 2> "$errors"; then
            is_draft=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["isDraft"])' "$metadata")
            [[ "$is_draft" == True ]] || { echo 'Refusing to modify an already published release.' >&2; exit 1; }
            # Existing artifacts are never overwritten. A partial previous upload
            # needs review before retrying; the release remains a draft on failure.
            gh release upload "$RELEASE_TAG" release-artifacts/*.flatpak release-artifacts/*-source.tar.gz release-artifacts/SHA256SUMS
            gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          elif grep -Fqi 'release not found' "$errors"; then
            gh release create "$RELEASE_TAG" release-artifacts/*.flatpak release-artifacts/*-source.tar.gz release-artifacts/SHA256SUMS "${args[@]}"
          else
            cat "$errors" >&2
            exit 1
          fi
