name: Validate Veyra
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vaultwarden:
    uses: ./.github/workflows/vaultwarden-compatibility.yml
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Check version manifests and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm generate
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build native application
        run: pnpm desktop:build
      - name: Retain native binary for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veyra-native-linux
          path: src-tauri/target/release/veyra
          if-no-files-found: error
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - name: Audit frontend dependencies
        # Audit the committed lockfile without installing packages or running lifecycle scripts.
        # The Linux build separately enforces the frozen lockfile and release-age policy.
        run: pnpm audit --audit-level high
      - name: Audit Rust dependencies
        if: ${{ !cancelled() }}
        run: |
          rustup show active-toolchain
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veyra-native-linux
          path: native-binary
      - run: chmod +x native-binary/veyra
      - name: Install packaging and display tools
        run: |
          sudo apt-get update
          # Ubuntu's AppStream 1.0.2 needs the GdkPixbuf SVG loader to compose our scalable icon.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream librsvg2-common desktop-file-utils dbus-x11 xvfb xdotool xclip imagemagick
      - name: Install signed runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Package offline and test installed application
        run: bash scripts/build-flatpak.sh native-binary/veyra
      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.flatpak > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veyra-linux-flatpak
          path: |
            artifacts/*.flatpak
            artifacts/SHA256SUMS
          if-no-files-found: error
