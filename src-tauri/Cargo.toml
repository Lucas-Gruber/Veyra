[package]
name = "veyra"
version = "0.1.0-alpha.2"
description = "Your vault. One shortcut away."
authors = ["Veyra contributors"]
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-only"

[lib]
name = "veyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
zeroize = "1.9.1"

semver = "1"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13.3", features = ["json", "form", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "4988da44b0ac55778e3a45ec7363394509298866", features = ["internal"] }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "4988da44b0ac55778e3a45ec7363394509298866" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "4988da44b0ac55778e3a45ec7363394509298866" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "4988da44b0ac55778e3a45ec7363394509298866" }


[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
